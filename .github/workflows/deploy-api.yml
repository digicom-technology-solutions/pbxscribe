name: Deploy PBXScribe API

on:
  push:
    branches:
      - main
      - "feature/*"

permissions:
  id-token: write  # required for OIDC
  contents: read

env:
  AWS_REGION: us-east-2
  NODE_VERSION: "22"

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pbxscribe
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci --prefix src/api

      - name: Run tests
        run: npm test --prefix src/api
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: pbxscribe
          DB_USER: postgres
          DB_PASSWORD: postgres

  deploy-dev:
    name: Deploy → Dev
    needs: build
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: GitHubActions-dev
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy Lambda functions to dev
        run: bash deploy.sh dev --code-only

  deploy-prod:
    name: Deploy → Prod
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: GitHubActions-prod
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy Lambda functions to prod
        run: bash deploy.sh prod --code-only
